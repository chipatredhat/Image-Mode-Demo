- name: Get disk to partition
  ansible.builtin.shell: lsblk | grep G | grep -Ev 'vda|sda|loop|^ ' | head -1 | awk '{print $1}'
  register: BLANK_DISK
  changed_when: false
  when: PARTITION_DISK | bool

- name: Fail if no blank disk was found
  ansible.builtin.fail:
    msg: "PARTITION_DISK is true but no candidate disk was found by lsblk"
  when: PARTITION_DISK | bool and BLANK_DISK.stdout | length == 0

- name: Check if the disk already exists
  ansible.builtin.stat:
    path: /dev/{{ BLANK_DISK.stdout }}1
  register: NEWDISK
  when: PARTITION_DISK | bool

- name: Partition disk
  ansible.builtin.shell:
    cmd: echo 'type=83' | sfdisk /dev/{{ BLANK_DISK.stdout }}
  when: PARTITION_DISK | bool and not NEWDISK.stat.exists

- name: Format disk
  community.general.filesystem:
    fstype: xfs
    dev: /dev/{{ BLANK_DISK.stdout }}1
  when: PARTITION_DISK | bool

- name: Add disk to fstab and mount
  ansible.posix.mount:
    path: /var/lib/libvirt/images
    src: /dev/{{ BLANK_DISK.stdout }}1
    fstype: xfs
    opts: defaults
    state: mounted
  when: PARTITION_DISK | bool
