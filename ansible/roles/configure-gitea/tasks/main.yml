  - name: See if a token has already been created
    ansible.builtin.stat:
      path: /home/{{ USERNAME }}/gitea_token.txt
    register: tokenfile

  # Output looks like: "Access token was successfully created: <token>"
  - name: Create a token for {{ GIT_USERNAME }}
    ansible.builtin.command: /usr/local/bin/gitea admin user generate-access-token -u {{ GIT_USERNAME }} --scopes all --config /etc/gitea/app.ini
    register: USER_TOKEN
    become: true
    become_user: "{{ GIT_ACCOUNTNAME }}"
    no_log: true
    when: not tokenfile.stat.exists
    failed_when: USER_TOKEN.rc != 0 or (USER_TOKEN.stdout | trim | length == 0)

  - name: Write the token so it is accessible
    ansible.builtin.copy:
      content: "{{ USER_TOKEN.stdout }}"
      dest: /home/{{ USERNAME }}/gitea_token.txt
      mode: '0600'
    no_log: true
    when: not tokenfile.stat.exists

  - name: Get just the token
    ansible.builtin.shell: "awk '{print $NF}' /home/{{ USERNAME }}/gitea_token.txt"
    register: JUST_GITEA_USER_TOKEN
    changed_when: false
    no_log: true
    failed_when: JUST_GITEA_USER_TOKEN.rc != 0 or (JUST_GITEA_USER_TOKEN.stdout | trim | length == 0)

  - name: Write out JUST_GITEA_USER_TOKEN to /home/{{ USERNAME }}/just_gitea_token.txt
    ansible.builtin.copy:
      content: "{{ JUST_GITEA_USER_TOKEN.stdout }}"
      dest: "/home/{{ USERNAME }}/just_gitea_token.txt"
      mode: '0600'
    no_log: true

  - name: Write git global config
    ansible.builtin.blockinfile:
      path: "/home/{{ USERNAME }}/.gitconfig"
      create: true
      mode: 0644
      owner: "{{ USERNAME }}"
      block: |
        [user]
                  name = student
                  email = student@example.com

  - name: Make git directory
    ansible.builtin.file:
      state: directory
      path: ~/git
    become: yes
    become_user: "{{ GIT_USERNAME }}"

