# Downloads use curl instead of get_url: the ansible-core 2.14 in RHEL 9 cannot make HTTPS
# requests from modules running on a Python 3.12 target such as RHEL 10 ('cert_file' error).
# Tokens are passed through the environment so they never appear in the logged command line.

- name: Create DVD download directory
  ansible.builtin.file:
    path: "{{ DVD_DIR }}"
    state: directory
    mode: '0777'
  become: true

- name: Get Download Token
  ansible.builtin.shell: >-
    set -o pipefail;
    curl -sSf https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
    -d grant_type=refresh_token -d client_id=rhsm-api --data-urlencode "refresh_token=${OFFLINE_TOKEN}"
    | jq --raw-output .access_token
  environment:
    OFFLINE_TOKEN: "{{ OFFLINE_TOKEN }}"
  register: DOWNLOAD_TOKEN
  changed_when: false
  failed_when: DOWNLOAD_TOKEN.rc != 0 or DOWNLOAD_TOKEN.stdout in ['', 'null']

- name: Download RHEL 9 ISO and verify its checksum
  ansible.builtin.shell: |
    set -eo pipefail
    curl -sSfL -H "Authorization: Bearer ${DOWNLOAD_TOKEN}" -o "{{ DVD_DIR }}/{{ RHEL_9_ISO }}.part" \
      "https://api.access.redhat.com/management/v1/images/{{ RHEL9_SHA }}/download"
    echo "{{ RHEL9_SHA }}  {{ DVD_DIR }}/{{ RHEL_9_ISO }}.part" | sha256sum -c --quiet
    mv "{{ DVD_DIR }}/{{ RHEL_9_ISO }}.part" "{{ DVD_DIR }}/{{ RHEL_9_ISO }}"
  args:
    creates: "{{ DVD_DIR }}/{{ RHEL_9_ISO }}"
  environment:
    DOWNLOAD_TOKEN: "{{ DOWNLOAD_TOKEN.stdout }}"

- name: Refresh Download Token (In case download took a long time)
  ansible.builtin.shell: >-
    set -o pipefail;
    curl -sSf https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
    -d grant_type=refresh_token -d client_id=rhsm-api --data-urlencode "refresh_token=${OFFLINE_TOKEN}"
    | jq --raw-output .access_token
  environment:
    OFFLINE_TOKEN: "{{ OFFLINE_TOKEN }}"
  register: DOWNLOAD_TOKEN
  changed_when: false
  failed_when: DOWNLOAD_TOKEN.rc != 0 or DOWNLOAD_TOKEN.stdout in ['', 'null']

- name: Download RHEL 10 ISO and verify its checksum
  ansible.builtin.shell: |
    set -eo pipefail
    curl -sSfL -H "Authorization: Bearer ${DOWNLOAD_TOKEN}" -o "{{ DVD_DIR }}/{{ RHEL_10_ISO }}.part" \
      "https://api.access.redhat.com/management/v1/images/{{ RHEL10_SHA }}/download"
    echo "{{ RHEL10_SHA }}  {{ DVD_DIR }}/{{ RHEL_10_ISO }}.part" | sha256sum -c --quiet
    mv "{{ DVD_DIR }}/{{ RHEL_10_ISO }}.part" "{{ DVD_DIR }}/{{ RHEL_10_ISO }}"
  args:
    creates: "{{ DVD_DIR }}/{{ RHEL_10_ISO }}"
  environment:
    DOWNLOAD_TOKEN: "{{ DOWNLOAD_TOKEN.stdout }}"
