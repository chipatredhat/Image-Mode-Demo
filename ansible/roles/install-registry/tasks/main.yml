- name: Create the data directory for the registry container
  ansible.builtin.file:
    path: "{{ REGISTRYDIR }}/data"
    state: directory

- name: Create the certs directory for the registry container
  ansible.builtin.file:
    path: "{{ REGISTRYDIR }}/certs"
    state: directory
    mode: '0700'

- name: Install the registry crt
  ansible.builtin.copy:
    src: files/wildcard.example.com.crt
    dest: "{{ REGISTRYDIR }}/certs/wildcard.example.com.crt"
    mode: '0644'

- name: Install the registry key
  ansible.builtin.copy:
    src: files/wildcard.example.com.key
    dest: "{{ REGISTRYDIR }}/certs/wildcard.example.com.key"
    mode: '0600'

# Older versions of this playbook also started a podman_container named "registry"
# outside of systemd.  Remove it so it does not fight the quadlet over port 5000.
- name: Remove the legacy non-systemd registry container if present
  containers.podman.podman_container:
    name: registry
    state: absent

- name: Install the registry.container quadlet file
  ansible.builtin.copy:
    src: files/registry.container
    dest: /etc/containers/systemd/registry.container
    mode: '0644'

# Quadlet units are generated by systemd and cannot be "enabled";
# the [Install] section in registry.container makes them start on boot.
- name: Reload systemd and start the registry service
  ansible.builtin.systemd_service:
    name: registry
    state: started
    daemon_reload: true
