---
- name: Configure Image Mode Workshop for use at demo.redhat.com
  hosts: image_mode
  become: yes
  gather_facts: yes

  vars_files:
    # Use credentials.yml if it exists, otherwise the (empty) example so the assert below explains what is missing
    - [credentials.yml, credentials.yml.example]
    - "{{ playbook_dir }}/roles/prep-environment/defaults/main.yml"

  vars:
    PREP_WORKFLOW: False
    PARTITION_DISK: False

  pre_tasks:
    # Only the variable names are printed, never their values
    - name: Make sure the required credentials are set
      ansible.builtin.assert:
        that: (lookup('vars', item, default='') | default('', true) | string | length) > 0
        fail_msg: "{{ item }} is empty. Set it in ansible/credentials.yml, or pass your credentials file with -e @/path/to/credentials.yml"
        success_msg: "{{ item }} is set"
      loop:
        - OFFLINE_TOKEN
        - PMUSERNAME
        - PMPASSWORD

  roles:
    - partition-disk
    - prep-environment
    - create-user
    - download-iso
    - configure-firewall
    - install-registry
    - pull-images
    - {role: user-content, become_user: "{{ USERNAME }}"}
    - web-content
    - install-vscode
    - install-gitea
    - {role: configure-gitea, become_user: "{{ USERNAME}}"}
    - install-novnc
    - install-tigervnc-server
    - {role: git-content, become_user: "{{ USERNAME}}"}
    - install-runner
    - api-simulation
    - {role: prep-workflow, become_user: "{{ USERNAME}}"}
    - display-results
