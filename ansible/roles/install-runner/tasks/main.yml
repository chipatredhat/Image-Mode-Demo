# The registration token is kept in /root (not the web root) so it is not publicly downloadable
- name: Remove the old publicly readable runner token if present
  ansible.builtin.file:
    path: "{{ WEB_DIRECTORY }}/html/gitea_action"
    state: absent

- name: Write runner token to file
  ansible.builtin.shell: |
    umask 077
    sudo -u git /usr/local/bin/gitea actions generate-runner-token --config /etc/gitea/app.ini > /root/gitea_runner_token
  args:
    creates: /root/gitea_runner_token
  no_log: true

- name: Read runner token into a variable
  ansible.builtin.command: cat /root/gitea_runner_token
  register: RUNNER_TOKEN
  changed_when: false
  no_log: true

# curl instead of get_url: RHEL 9's ansible-core 2.14 can't do HTTPS from modules on a Python 3.12 target.
# The binary is still installed as /usr/bin/act-runner so the service and scripts don't change.
- name: Get gitea-runner {{ RUNNER_VERSION }} and verify its checksum
  ansible.builtin.shell: |
    set -eo pipefail
    BASE=https://dl.gitea.com/gitea-runner/{{ RUNNER_VERSION }}/gitea-runner-{{ RUNNER_VERSION }}-linux-amd64
    curl -sSfL -o /usr/bin/act-runner.part "${BASE}"
    SUM=$(curl -sSfL "${BASE}.sha256" | awk '{print $1}')
    echo "${SUM}  /usr/bin/act-runner.part" | sha256sum -c --quiet
    mv /usr/bin/act-runner.part /usr/bin/act-runner
  args:
    creates: /usr/bin/act-runner

- name: Set runner ownership and mode
  ansible.builtin.file:
    path: /usr/bin/act-runner
    mode: '0770'
    owner: root
    group: users

- name: Make /etc/runner directory
  ansible.builtin.file:
    path: /etc/act-runner
    owner: root
    group: users
    state: directory
    mode: 0770

- name: Make runner working directories
  ansible.builtin.file:
    path: /home/{{ USERNAME }}/runner/{{ item }}
    state: directory
  loop:
    - workdir
    - actcache
  become_user: "{{ USERNAME }}"

- name: Copy runner config
  ansible.builtin.copy:
    src: files/runner.cfg
    dest: /home/{{ USERNAME }}/runner/config.yaml
    owner: "{{ USERNAME }}"
    group: users

- name: Register runner
  ansible.builtin.shell: cd /home/{{ USERNAME }}/runner && /usr/bin/act-runner register -c /home/{{ USERNAME }}/runner/config.yaml --no-interactive --instance http://server.example.com:3000 --token {{ RUNNER_TOKEN.stdout }}
  args:
    creates: /home/{{ USERNAME }}/runner/.runner
  become_user: "{{ USERNAME }}"
  no_log: true

- name: Copy start_runner.sh
  ansible.builtin.copy:
    src: files/start_runner.sh
    dest: /home/{{ USERNAME }}/runner/start_runner.sh
    owner: "{{ USERNAME }}"
    group: users
    mode: 0755

- name: Install act-runner service
  ansible.builtin.copy:
    src: files/act-runner.service
    dest: /etc/systemd/system/act-runner.service
    owner: root
    group: root
    mode: '0644'

- name: Start and enable act-runner service
  ansible.builtin.systemd:
    name: act-runner
    state: started
    enabled: yes
    daemon_reload: yes
