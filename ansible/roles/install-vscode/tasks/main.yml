  # rpm --import instead of rpm_key: RHEL 9's ansible-core 2.14 can't do HTTPS from modules on a Python 3.12 target
  - name: Install the vscode gpg key
    ansible.builtin.command: rpm --import https://packages.microsoft.com/keys/microsoft.asc
    changed_when: false

  - name: Create repo file
    ansible.builtin.copy:
      dest: /etc/yum.repos.d/vscode.repo
      content: |
          [vscode-repository]
          name=Visual Studio Code
          baseurl=https://packages.microsoft.com/yumrepos/vscode
          enabled=1
          autorefresh=1
          type=rpm-md
          gpgcheck=1
          gpgkey=https://packages.microsoft.com/keys/microsoft.asc
  #  delegate_to: localhost    

  - name: Install vscode
    ansible.builtin.dnf:
      name: code
      state: present
